name: CI

on:
  push:
    branches: [develop, main, 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop, main, 'release/**', 'hotfix/**']

# Cancela execuções antigas da mesma branch quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # O nome deste job (com o SO) é o check exigido pelas regras de proteção de main e develop.
    # Renomear aqui exige atualizar os rulesets do repositório.
    name: Build e testes (${{ matrix.os }})
    strategy:
      # Roda os três SOs até o fim mesmo se um falhar, para ver todas as falhas de uma vez.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo e tags: o MinVer calcula a versão a partir da tag mais próxima.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # No Linux o app usa o VLC do sistema (no Windows e no macOS ele vem nos pacotes NuGet).
      - name: Instalar o VLC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvlc-dev vlc-plugin-base vlc-plugin-video-output

      - name: Restore
        run: dotnet restore VibePlayer.slnx

      - name: Build
        run: dotnet build VibePlayer.slnx --configuration Release --no-restore

      - name: Conferir plugins do VLC
        shell: bash
        run: bash .github/scripts/check-vlc-plugins.sh src/VibePlayer.App/bin/Release

      - name: Testes unitários
        run: dotnet test tests/VibePlayer.UnitTests --configuration Release --no-build

      - name: Testes E2E
        run: dotnet test tests/VibePlayer.E2ETests --configuration Release --no-build
